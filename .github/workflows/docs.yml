name: CI Docs

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install great-docs ipykernel

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build docs
        run: great-docs build

      # Self-referencing URLs are excluded because pages added in this commit
      # are not deployed yet and would 404 until after publish. They are
      # validated against the local build in the next step instead.
      - name: Check documentation links
        run: great-docs check-links --ignore "recap\.test|nsls2\.github\.io"

      - name: Verify README documentation links resolve to built pages
        run: |
          set -euo pipefail
          site=great-docs/_site
          status=0
          urls=$(grep -o 'https://nsls2.github.io/recap/[^)>]*' README.md \
                 | sed 's|https://nsls2.github.io/recap/||' \
                 | sed 's|/$|/index.html|' | sort -u)
          for u in $urls; do
            path="$site/${u:-index.html}"
            if [ -f "$path" ]; then
              echo "ok   $u"
            else
              echo "MISS $u"
              status=1
            fi
          done
          exit $status

      - name: Save docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site
          include-hidden-files: true

      - name: Upload build timings
        uses: actions/upload-artifact@v7
        with:
          name: build-timings
          path: great-docs/_site/build-timings.json

  publish-docs:
    name: Publish Docs
    runs-on: ubuntu-latest
    needs: build-docs
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  preview-docs:
    name: Preview Docs
    runs-on: ubuntu-latest
    needs: build-docs
    if: github.event_name == 'pull_request'
    permissions:
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site

      - name: Configure pull release name
        run: |
          echo "RELEASE_NAME=pr-${{ github.event.number }}" >> $GITHUB_ENV

      - name: Create GitHub deployment
        uses: bobheadxi/deployments@v1
        if: ${{ !github.event.pull_request.head.repo.fork }}
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: ${{ env.RELEASE_NAME }}
          ref: ${{ github.head_ref }}
          logs: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
