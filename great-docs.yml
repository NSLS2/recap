# Great Docs Configuration
# See https://posit-dev.github.io/great-docs/user-guide/configuration.html

# Module Name (optional)
# ----------------------
# Set this if your importable module name differs from the project name.
# Example: project 'py-yaml12' with module name 'yaml12'
module: recap

# Site Identity
# -------------
display_name: Recap
repo: https://github.com/nsls2/recap
logo: docs/assets/recap_logo.png
favicon: docs/assets/favicon.ico

# Docstring Parser
# ----------------
# The docstring format used in your package (numpy, google, or sphinx)
parser: numpy

# Dynamic Introspection
# ---------------------
# Use runtime introspection for more accurate documentation (default: true)
# Set to false if your package has cyclic alias issues (e.g., PyO3/Rust bindings)
dynamic: true

# API Discovery Settings
# ----------------------
# Exclude items from auto-documentation
# exclude:
#   - InternalClass
#   - helper_function

# Logo & Favicon
# ---------------
# Point to a single logo file (replaces the text title in the navbar):
# logo: assets/logo.svg
#
# For light/dark variants:
# logo:
#   light: assets/logo-light.svg
#   dark: assets/logo-dark.svg
#
# To show the text title alongside the logo, add: show_title: true

# Author Information
# ------------------
# Author metadata for display in the landing page sidebar
# You can add additional fields: github, orcid, affiliation, homepage
authors:
  - name: Venkateswaran Shekar
    role: Author
    affiliation: Brookhaven National Lab
    email: vshekar1@bnl.gov
    # github: 
    # orcid: 
    # homepage: 

# Diataxis Content Sections
# -------------------------

sections:
  - title: Getting Started
    dir: docs/getting_started
  - title: How-To Guides
    dir: docs/how-to
    sidebar_groups:
      - section: Quick Start
        contents:
          - quick-start-create-and-store-data-locally.qmd
          - setup-recap-server.qmd
          - use-remote-authentication.qmd
      - section: Create Templates
        contents:
          - resource-template.qmd
          - process-template.qmd
          - nested-resource-templates.qmd
          - update-and-retire-templates.qmd
      - section: Create and Edit Instances
        contents:
          - create-resources.qmd
          - build-process-runs.qmd
          - add-runtime-children.qmd
          - edit-resource-properties.qmd
          - copy-frozen-resources.qmd
          - manage-resource-lifecycle.qmd
          - handle-errors-and-request-ids.qmd
          - use-revisions-and-idempotency.qmd
      - section: Query Experiments
        contents:
          - query-resources.qmd
          - query-process-runs.qmd
          - query-templates-and-namespaces.qmd
          - choose-query-shape-and-loading.qmd
          - provenance-queries.qmd
          - performance.qmd
  - title: Explanation
    dir: docs/explanation
  - title: Tutorials
    dir: docs/tutorials

custom_pages:
  - dir: docs/assets
    output: docs/assets


navbar_order:
  - Getting Started
  - How-To Guides
  - Explanation
  - Tutorials
  - Reference
  - Changelog

